name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build and verify the Windows installer
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and build
        run: npm run check

      - name: Package extension
        run: npm run zip

      - name: Upload extension package
        uses: actions/upload-artifact@v7
        with:
          name: cueweave-chrome
          path: .output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true

  desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify desktop source
        run: npm run typecheck --workspace @cueweave/desktop

      - name: Run real Electron smoke checks
        run: npm run test:desktop:smoke

      - name: Verify themed desktop controls
        run: node apps/desktop/scripts/controls-acceptance.mjs

      - name: Build Windows installer
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        run: npm run dist:desktop

      - name: Verify subtitle projects
        run: npm run test:desktop:project
        env:
          CUEWEAVE_PROJECT_EXECUTABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_installer && format('{0}/apps/desktop/dist/package/win-unpacked/CueWeave.exe', github.workspace) || '' }}

      - name: Verify desktop settings
        run: npm run test:desktop:settings

      - name: Verify subtitle translation
        run: npm run test:desktop:translation

      - name: Verify unpacked application
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        run: npm run test:desktop:d0

      - name: Verify installer lifecycle
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        run: npm run test:desktop:installer

      - name: Upload desktop installer
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        uses: actions/upload-artifact@v7
        with:
          name: cueweave-desktop-windows-x64
          path: apps/desktop/dist/package/CueWeave-*-x64.exe
          if-no-files-found: error
